# DVR-Scan default configuration for batch processing.
# Full option reference: https://dvr-scan.readthedocs.io/en/latest/guide/config_file/
# CLI flags override these values.

# Motion detection sensitivity (lower = more sensitive)
# threshold = 0.15

# Minimum event length in seconds before saving a clip
# min-event-length = 2.0

# Output mode: copy, reencode, or split
# output-mode = copy

# Timecode format for output filenames
# timecode-format = %H-%M-%S

# Number of CPU threads (0 = auto)
# num-threads = 0
